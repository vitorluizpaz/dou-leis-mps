<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOU Leis e MPs</title>
<style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;color:#182230;background:#f6f8fa}h1{margin-bottom:4px}.card{background:white;border:1px solid #dce2e8;border-radius:12px;padding:20px;margin:18px 0}button{background:#1264a3;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}input{padding:9px;border:1px solid #bbc5d0;border-radius:6px}li{margin:14px 0}.meta{color:#657383;font-size:.9em}.empty{color:#657383}</style></head>
<body><h1>DOU — Leis e MPs</h1><p class="meta">Agendamento: <span id="schedule">__SCHEDULE__</span></p>
<div class="card"><h2>Testar coleta</h2><p>Escolha uma data e informe a chave de scraping.</p><input id="date" type="date"><input id="scrape-key" type="password" placeholder="SCRAPE_API_KEY"><input id="read-key" type="password" placeholder="READ_API_KEY"><button onclick="scrape()">Executar scraper</button><span id="status"></span></div>
<div class="card"><h2>Publicações salvas</h2><button onclick="loadItems()">Atualizar</button><ul id="items"><li class="empty">Carregando…</li></ul></div>
<script>const today=new Date().toISOString().slice(0,10);document.querySelector('#date').value=today;async function loadItems(){const d=document.querySelector('#date').value;const r=await fetch('/api/laws?date='+d,{headers:{'X-API-Key':document.querySelector('#read-key').value}});const items=await r.json();document.querySelector('#items').innerHTML=items.length?items.map(x=>`<li><a href="${x.source_url}" target="_blank">${x.title}</a><div class="meta">${x.kind} · ${x.published_date}</div></li>`).join(''):'<li class="empty">Nenhuma publicação salva para esta data.</li>'}async function scrape(){const s=document.querySelector('#status');s.textContent=' Executando…';try{const r=await fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':document.querySelector('#scrape-key').value},body:JSON.stringify({date:document.querySelector('#date').value})});const x=await r.json();s.textContent=' '+(r.ok?`OK: ${x.found} encontrada(s).`:'Erro: '+(x.detail||'falha'));loadItems()}catch(e){s.textContent=' Erro de conexão.'}}loadItems();</script></body></html>
