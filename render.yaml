services:
  - type: web
    name: dou-leis-mps
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: READ_API_KEY
        sync: false
      - key: SCRAPE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCRAPE_INTERVAL_MINUTES
        value: "1440"
      - key: SCRAPE_HOUR
        value: "8"
      - key: SCRAPE_MINUTE
        value: "0"
      - key: TIMEZONE
        value: America/Sao_Paulo
