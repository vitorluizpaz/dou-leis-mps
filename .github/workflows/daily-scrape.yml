name: Scrape DOU daily

on:
  schedule:
    # Backups after 10:00 BRT; avoid GitHub's busy :00 slot.
    - cron: "17,47 13 * * *"
  workflow_dispatch:

concurrency:
  group: dou-daily-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out backup fetcher
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install HTTP client
        run: python3 -m pip install requests==2.34.2
      - name: Trigger scraper
        env:
          API_URL: ${{ secrets.API_URL }}
          SCRAPE_API_KEY: ${{ secrets.SCRAPE_API_KEY }}
        run: python3 scripts/run_daily.py
