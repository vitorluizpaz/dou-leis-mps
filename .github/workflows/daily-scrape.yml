name: Scrape DOU daily

on:
  schedule:
    # Backups after 10:00 BRT; avoid GitHub's busy :00 slot.
    - cron: "17,47 13 * * *"
  workflow_dispatch:

concurrency:
  group: dou-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backup fetcher
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HTTP client
        run: python3 -m pip install requests==2.34.2
      - name: Trigger scraper
        env:
          API_URL: ${{ secrets.API_URL }}
          SCRAPE_API_KEY: ${{ secrets.SCRAPE_API_KEY }}
        run: python3 scripts/run_daily.py
